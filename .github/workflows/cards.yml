name: Update profile cards
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths: [".github/scripts/cards.py"]
permissions:
  contents: write
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: nullopt-t
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg
          git diff --staged --quiet || git commit -m "chore: update profile cards"
          git push
